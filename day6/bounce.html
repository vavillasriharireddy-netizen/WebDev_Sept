<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce</title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            background-color: red;
            border-radius: 50%;
            animation: bounce 5s infinite ease-in-out;
        }
        @keyframes bounce {
            0%{
                background-color: red;
                opacity: 1;
            }
            50%{
                background-color: blue;
                opacity: 0.75;
            }
            75%{
                background-color: yellow;
                opacity: 0.4;
            }
            100%{
                background-color: white;
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
