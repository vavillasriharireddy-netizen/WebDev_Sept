<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            border: 1px solid red;
        }
        .ex1 p{
            display: block;
        }
        .ex2 p{
            display: inline;
        }
        .ex3 p{
            display: none;
        }
    </style>
</head>
<body>
    <div class="ex1">display : block
        <p>block</p>
    </div>
    <div class="ex2">display : inline
        <p>inline</p>
    </div>

    <div class="ex3">display : none
        <p>none</p> 
    </div>
</body>
</html>
