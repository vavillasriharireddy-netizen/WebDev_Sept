<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Explorer</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    
    <header>
        <h1 id="pageTitle">Student Explorer</h1>
        <p>Explore Student profile</p>
    </header>


    <main class="container">
        <section class="search-panel">
            <h2>Find Profiles</h2>
            <div class="search-controls">
                <input type="text" id="searchInput" placeholder="Search by Name or Email">
                <button id="searchBtn">Search</button>
                <button id="loadBtn" onclick=loadProfile()>Load All Profiles</button>
                <p id="status">Click Load All Profiles to begin</p>
                <p id="profileCount">Profiles Dispalyed : 0</p>
                
            </div>
        </section>
        <section id="profileConatiner" class="profiles">
            <!-- API profile card will be displayed -->
        </section>
        <section>

        </section>
    </main>

    <script src="./script.js"></script>
</body>
</html>
