<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box,.books{
            background-color: red;
            height: 150px;
            width: 150px;
            border: 2px solid black;
            border-radius: 10px;
            margin: 50px;
            padding: 50px 30px;
            box-sizing: border-box;
        }

        div p{
            border: 1px solid green;
            padding: 10px 5px;
        }
    </style>
</head>
<body>
    <div class="box">
        <p>Hello Guys</p>
    </div>

    <div class="books">
        <p>Hello</p>
    </div>
</body>
</html>
